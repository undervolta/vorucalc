[package]
name = "vorucalc"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chumsky = "0.13.0"
logos = "0.16.1"
regex = "1.13.1"
slint = "1.18.1"

[build-dependencies]
slint-build = "1.18.1"

[build]
rustflags = ["-Z", "threads=8"]

[profile.dev]
debug = "line-tables-only"
# codegen-backend = "cranelift"

[profile.release]
codegen-units = 1
lto = true
